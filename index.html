<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detector de IA Orión</title>
<meta name="theme-color" content="#1a102e">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0a1a;--card:#1c1433;--card2:#231b3f;--lila:#c9b6ff;--lila2:#a78bfa;--borde:#3a2d61;--txt:#e9e4ff;--muted:#9f93c7}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#2a1e5a 0%,var(--bg) 60%);color:var(--txt);font-family:Inter,sans-serif;min-height:100vh}
h1,h2{font-family:"Cormorant Garamond",serif}.wrap{max-width:880px;margin:0 auto;padding:16px 14px 90px}
.header{text-align:center;padding:28px 10px 10px}.badge{display:inline-block;letter-spacing:.28em;font-size:.7rem;color:var(--lila)}
.header h1{font-size:2.8rem;margin:6px 0 4px;color:#e8ddff}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--borde);border-radius:20px;padding:18px;margin:14px 0}
label{font-size:.7rem;letter-spacing:.18em;color:var(--muted);display:block;margin:12px 2px 6px;font-weight:600}
select,input,textarea{width:100%;background:#110d20;border:1px solid var(--borde);color:var(--txt);border-radius:14px;padding:14px;font-size:1rem}
textarea{min-height:220px;resize:vertical;line-height:1.6}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{border:none;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--lila2);color:#120c22}.btn-ghost{background:#1a1430;color:var(--txt);border:1px solid var(--borde)}
.big-num{font-size:4.8rem;font-weight:800;color:#e9ddff;font-family:"Cormorant Garamond",serif}
.pill{display:inline-block;background:#2a224a;border:1px solid var(--borde);border-radius:999px;padding:6px 12px;font-size:.75rem;color:var(--lila);margin:4px}
.bar{height:8px;background:#140f27;border-radius:99px;overflow:hidden;margin-top:8px;border:1px solid var(--borde)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c5cff,#c9b6ff);border-radius:99px}
.small{font-size:.85rem;color:var(--muted);margin-top:8px}.btn:focus,input:focus,select:focus,textarea:focus{outline:2px solid var(--lila2);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
<div class="badge">✦ ANÁLISIS LINGÜÍSTICO · ORIÓN ✦</div>
<h1>Detector de IA Orión</h1>
<div class="small">“Primero analizar. Después revisar. El detector orienta; la revisión humana decide.”</div>
</div>

<div class="card">
<label>PAÍS</label>
<select id="pais"></select>
<div class="row">
<div><label>PROVINCIA / ESTADO / REGIÓN</label><input id="region" placeholder="Ej. Santa Fe"></div>
<div><label>CIUDAD</label><input id="ciudad" placeholder="Ej. Reconquista"></div>
</div>
</div>

<div class="card">
<textarea id="texto" placeholder="Pegá acá el rol completo..."></textarea>
<div class="btns">
<button class="btn btn-primary" onclick="analizar()">✦ Analizar texto</button>
<button class="btn btn-ghost" onclick="cargarEjemplo()">Probar ejemplo</button>
<button class="btn btn-ghost" onclick="limpiar()">Limpiar</button>
</div>
</div>
<div id="output"></div>
<div id="historial" class="card"></div>
</div>

<script>
const PAISES = ["Argentina","Bolivia","Chile","Colombia","Costa Rica","Cuba","Ecuador","El Salvador","Guatemala","Honduras","México","Nicaragua","Panamá","Paraguay","Perú","República Dominicana","Uruguay","Venezuela","Puerto Rico","España","Guinea Ecuatorial","Estados Unidos — español","Belice — español","Otro / no especificar"];

const REGIONAL = {
  "Argentina":["che","re","posta","laburo","pibe","piba","dale","ahre","boludo","bondi","quilombo","copado","bancar","vos","tenés","podés","querés"],
  "México":["güey","wey","órale","chido","chamba","neta","chale","ustedes"],
  "Venezuela":["pana","chamo","chévere","burda","vaina"],
  "Chile":["po","cachai","bacán","fome","al tiro","pololo","weón"],
  "España":["tío","vale","guay","currar","mola","chaval","vosotros"],
  "Colombia":["parce","bacano","camellar","parcero"],
  "Perú":["causa","pata","jato"],
  "Uruguay":["bo","gurí","botija"],
  "Cuba":["asere","qué bolá"],
  "Costa Rica":["mae","pura vida","tuanis"]
};

const FORMAL = ["sin embargo","no obstante","por lo tanto","además","asimismo","en consecuencia","cabe destacar","en este sentido","por consiguiente"];
const CONNECTORS = ["sin embargo","además","por otra parte","aunque","porque","por eso","entonces","mientras","finalmente","también","pero","así que","después","antes","cuando","si bien"];
const AI_PHRASES = ["en conclusión","es importante destacar","cabe destacar","en este sentido","por lo tanto","sin duda alguna","como modelo de lenguaje","en términos generales"];

const paisSelect = document.getElementById("pais");
PAISES.forEach(p => {
  const o = document.createElement("option");
  o.value = p;
  o.textContent = p;
  paisSelect.appendChild(o);
});
paisSelect.value = "Argentina";

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function tokenize(text){
  return text.match(/\p{L}+(?:['’-]\p{L}+)?/gu) || [];
}

function sentenceData(text){
  const raw = text.split(/[.!?…]+/).map(s => s.trim()).filter(s => tokenize(s).length >= 2);
  const lengths = raw.map(s => tokenize(s).length);
  if (!lengths.length) return {raw:[], lengths:[], mean:0, std:0};
  const mean = lengths.reduce((a,b)=>a+b,0)/lengths.length;
  const variance = lengths.reduce((a,b)=>a+Math.pow(b-mean,2),0)/lengths.length;
  return {raw, lengths, mean, std:Math.sqrt(variance)};
}

function countMatches(text, regex){
  const m = text.match(regex);
  return m ? m.length : 0;
}

function clamp(n,min=0,max=100){ return Math.max(min,Math.min(max,n)); }

function scoreAspect(name, data){
  const {words, sentences, mean, std, diversity, formal, regional, firstPerson, connectors, punctuation, repeatedStarts, longWords, aiPhrases} = data;

  if(name === "Estructura"){
    if(sentences.length < 2) return 50;
    let s = 50;
    if(std < 2.5) s += 16;
    else if(std < 5) s += 7;
    if(sentences.every(l => l >= 7 && l <= 28)) s += 12;
    if(sentences.length >= 5) s += 5;
    if(repeatedStarts >= 3) s += 8;
    return clamp(s);
  }

  if(name === "Formalidad") return clamp(35 + formal*8 + aiPhrases*5);

  if(name === "Naturalidad"){
    let s = 58;
    if(std > 7) s -= 14;
    else if(std > 4) s -= 5;
    if(regional > 0) s -= 8;
    if(punctuation > 0) s -= 2;
    if(connectors > 4) s += 7;
    return clamp(s);
  }

  if(name === "Vocabulario"){
    let s = 42;
    if(diversity < 45) s += 22;
    else if(diversity < 58) s += 12;
    else if(diversity > 82) s += 15;
    if(longWords > words.length * .20) s += 8;
    return clamp(s);
  }

  if(name === "Corrección"){
    let s = 38;
    if(words.length > 100) s += 12;
    if(formal >= 2) s += 8;
    if(punctuation >= 2) s += 5;
    return clamp(s);
  }

  if(name === "Voz personal"){
    let s = 35;
    if(firstPerson > 0) s -= 14;
    if(regional > 0) s -= 12;
    if(repeatedStarts >= 2) s += 4;
    return clamp(s);
  }

  return 50;
}

function analizar(){
  const texto = document.getElementById("texto").value.trim();
  if(!texto){ alert("Pegá un texto para analizar."); return; }

  const pais = document.getElementById("pais").value;
  const region = document.getElementById("region").value.trim();
  const ciudad = document.getElementById("ciudad").value.trim();

  const words = tokenize(texto);
  const lower = texto.toLowerCase();
  const sd = sentenceData(texto);
  const sentences = sd.lengths;
  const unique = new Set(words.map(w => w.toLowerCase()));
  const diversity = words.length ? unique.size / words.length * 100 : 0;

  const formal = FORMAL.filter(x => lower.includes(x)).length;
  const regionalTerms = pais === "Otro / no especificar"
    ? [...new Set(Object.values(REGIONAL).flat().filter(x => lower.includes(x)))]
    : [...new Set((REGIONAL[pais] || []).filter(x => lower.includes(x)))];

  const regional = regionalTerms.length;
  const firstPerson = countMatches(texto, /\b(yo|me|mi|mis|mío|mía|míos|mías|nos|nosotros|nosotras|nuestro|nuestra|pienso|creo|siento|considero|recuerdo|quiero|tengo|soy|estoy|puedo)\b/gi);
  const connectors = CONNECTORS.filter(x => lower.includes(x)).length;
  const aiPhrases = AI_PHRASES.filter(x => lower.includes(x)).length;
  const punctuation = countMatches(texto, /[;:—–]/g);

  const starts = sd.raw.map(s => tokenize(s).slice(0,2).join(" ").toLowerCase()).filter(Boolean);
  const startCounts = {};
  starts.forEach(x => startCounts[x] = (startCounts[x] || 0) + 1);
  const repeatedStarts = Object.values(startCounts).filter(n => n >= 2).length;
  const longWords = words.filter(w => w.length >= 9).length;

  const base = {words, sentences, mean:sd.mean, std:sd.std, diversity, formal, regional, firstPerson, connectors, punctuation, repeatedStarts, longWords, aiPhrases};
  const names = ["Estructura","Formalidad","Naturalidad","Vocabulario","Corrección","Voz personal"];

  const aspects = names.map(nombre => {
    const ia = Math.round(scoreAspect(nombre, base));
    return {nombre, ia, humano:100-ia};
  });

  const prom = Math.round(aspects.reduce((sum,a)=>sum+a.ia,0)/aspects.length);

  let ver, note;
  if(prom < 42){
    ver = "Pocas señales compatibles con escritura automatizada";
    note = "El texto presenta varios rasgos que pueden aparecer en escritura humana.";
  } else if(prom < 65){
    ver = "Señales mixtas — conviene revisar manualmente";
    note = "Hay indicadores de ambos tipos. El resultado no permite determinar autoría.";
  } else {
    ver = "Varias señales compatibles con escritura automatizada";
    note = "Algunos patrones del texto son frecuentes en textos muy uniformes o automatizados.";
  }

  const ctx = [pais,region,ciudad].filter(Boolean).join(" · ") || "Sin especificar";

  document.getElementById("output").innerHTML = `
    <div class="card" style="text-align:center">
      <div class="big-num">${prom}%</div>
      <div>ÍNDICE DE SEÑALES AUTOMATIZADAS</div>
      <div class="small" style="margin-top:8px;color:#f2d36b">${esc(ver)}</div>
      <div class="small">Contexto: ${esc(ctx)}</div>
      <div class="small">${esc(note)}</div>
    </div>

    <div class="card">
      <h2>Perfil por aspectos</h2>
      ${aspects.map(a => `
        <div style="margin:10px 0">
          <div style="display:flex;justify-content:space-between;gap:8px">
            <b>${esc(a.nombre)}</b>
            <b>${a.ia}% señales / ${a.humano}% humanas</b>
          </div>
          <div class="bar"><i style="width:${a.ia}%"></i></div>
        </div>
      `).join("")}
      <div class="small">Promedio del índice: (${aspects.map(a=>a.ia).join(" + ")}) / ${aspects.length} = ${prom}%</div>
    </div>

    <div class="card">
      <h2>Indicadores observados</h2>
      <span class="pill">${words.length} palabras</span>
      <span class="pill">${sentences.length} oraciones</span>
      <span class="pill">Diversidad ${Math.round(diversity)}%</span>
      <span class="pill">${firstPerson} marcas personales</span>
      <span class="pill">${connectors} conectores</span>
      <span class="pill">${formal} expresiones formales</span>
    </div>

    <div class="card">
      <h2>Rasgos regionales</h2>
      <div class="small">Detectado: ${regionalTerms.length ? regionalTerms.map(esc).join(" · ") : "Sin coincidencias"}</div>
      <div class="small">Las expresiones regionales aportan contexto lingüístico, pero no demuestran por sí solas quién escribió el texto.</div>
    </div>

    <div class="card">
      <h2>Informe para revisión</h2>
      <textarea style="min-height:210px" readonly>${esc(
`DETECTOR DE IA ORIÓN
Contexto: ${ctx}
Índice de señales automatizadas: ${prom}%
Resultado orientativo: ${ver}

ASPECTOS
${aspects.map(a=>`${a.nombre}: ${a.ia}% señales / ${a.humano}% humanas`).join("\n")}

INDICADORES
Palabras: ${words.length}
Oraciones: ${sentences.length}
Longitud media: ${sd.mean.toFixed(1)} palabras
Diversidad léxica: ${diversity.toFixed(1)}%
Marcas de primera persona: ${firstPerson}
Conectores detectados: ${connectors}
Expresiones formales: ${formal}
Rasgos regionales: ${regionalTerms.length ? regionalTerms.join(", ") : "ninguno"}

NOTA
Este informe es heurístico. No identifica con certeza si un texto fue escrito por una persona o por una IA y no debe utilizarse como prueba única.`
      )}</textarea>
    </div>
  `;

  guardarHistorial({fecha:new Date().toLocaleString("es-AR"), contexto:ctx, indice:prom});
}

function guardarHistorial(item){
  const key = "orion_detector_historial";
  const old = JSON.parse(localStorage.getItem(key) || "[]");
  old.unshift(item);
  localStorage.setItem(key, JSON.stringify(old.slice(0,10)));
  renderHistorial();
}

function renderHistorial(){
  const box = document.getElementById("historial");
  const items = JSON.parse(localStorage.getItem("orion_detector_historial") || "[]");

  box.innerHTML = `
    <h2>Historial</h2>
    ${items.length ? items.map(x=>`
      <div style="padding:10px 0;border-bottom:1px solid var(--borde)">
        <b>${esc(x.indice)}%</b> · ${esc(x.contexto)}
        <div class="small">${esc(x.fecha)}</div>
      </div>
    `).join("") : '<div class="small">Todavía no hay análisis guardados.</div>'}
    ${items.length ? '<button class="btn btn-ghost" style="margin-top:12px" onclick="borrarHistorial()">Borrar historial</button>' : ""}
  `;
}

function borrarHistorial(){
  localStorage.removeItem("orion_detector_historial");
  renderHistorial();
}

function cargarEjemplo(){
  document.getElementById("texto").value =
`*Lance Rivalder* —Siento el tirón en mi túnica y me giro hacia Aeltharion. Sus dedos aprietan la tela con fuerza mientras intenta respirar entre bocanadas hiperventiladas.`;
  analizar();
}

function limpiar(){
  document.getElementById("texto").value = "";
  document.getElementById("output").innerHTML = "";
}

renderHistorial();
</script>

</body>
</html>
