<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detector de IA Orión</title>
<meta name="theme-color" content="#1a102e">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0a1a;--card:#1c1433;--card2:#231b3f;--lila:#c9b6ff;--lila2:#a78bfa;--borde:#3a2d61;--txt:#e9e4ff;--muted:#9f93c7}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#2a1e5a 0%,var(--bg) 60%);color:var(--txt);font-family:Inter,sans-serif;min-height:100vh}
h1,h2{font-family:"Cormorant Garamond",serif}.wrap{max-width:880px;margin:0 auto;padding:16px 14px 90px}
.header{text-align:center;padding:28px 10px 10px}.badge{display:inline-block;letter-spacing:.28em;font-size:.7rem;color:var(--lila)}
.header h1{font-size:2.8rem;margin:6px 0 4px;color:#e8ddff}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--borde);border-radius:20px;padding:18px;margin:14px 0}
label{font-size:.7rem;letter-spacing:.18em;color:var(--muted);display:block;margin:12px 2px 6px;font-weight:600}
select,input,textarea{width:100%;background:#110d20;border:1px solid var(--borde);color:var(--txt);border-radius:14px;padding:14px;font-size:1rem}
textarea{min-height:220px;resize:vertical;line-height:1.6}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{border:none;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--lila2);color:#120c22}.btn-ghost{background:#1a1430;color:var(--txt);border:1px solid var(--borde)}
.big-num{font-size:4.8rem;font-weight:800;color:#e9ddff;font-family:"Cormorant Garamond",serif}
.pill{display:inline-block;background:#2a224a;border:1px solid var(--borde);border-radius:999px;padding:6px 12px;font-size:.75rem;color:var(--lila);margin:4px}
.bar{height:8px;background:#140f27;border-radius:99px;overflow:hidden;margin-top:8px;border:1px solid var(--borde)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c5cff,#c9b6ff);border-radius:99px}
.small{font-size:.85rem;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
<div class="badge">✦ ANÁLISIS LINGÜÍSTICO · ORIÓN ✦</div>
<h1>Detector de IA Orión</h1>
<div class="small">“Primero analizar. Después revisar. El detector orienta; la revisión humana decide.”</div>
</div>

<div class="card">
<label>PAÍS</label>
<select id="pais"></select>
<div class="row">
<div><label>PROVINCIA / ESTADO / REGIÓN</label><input id="region" placeholder="Ej. Santa Fe"></div>
<div><label>CIUDAD</label><input id="ciudad" placeholder="Ej. Reconquista"></div>
</div>
</div>

<div class="card">
<textarea id="texto" placeholder="Pegá acá el rol completo..."></textarea>
<div class="btns">
<button class="btn btn-primary" onclick="analizar()">✦ Analizar texto</button>
<button class="btn btn-ghost" onclick="cargarEjemplo()">Probar ejemplo</button>
<button class="btn btn-ghost" onclick="limpiar()">Limpiar</button>
</div>
</div>
<div id="output"></div>
<div id="historial" class="card"></div>
</div>
<script>
const PAISES=["Argentina","Bolivia","Chile","Colombia","Costa Rica","Cuba","Ecuador","El Salvador","Guatemala","Honduras","México","Nicaragua","Panamá","Paraguay","Perú","República Dominicana","Uruguay","Venezuela","Puerto Rico","España","Guinea Ecuatorial","Estados Unidos — español","Belice — español","Otro / no especificar"];
const REGIONAL={"Argentina":["che","re","posta","laburo","pibe","piba","dale","ahre","boludo","bondi","quilombo"],"México":["güey","wey","órale","chido","chamba","neta","chale"],"Venezuela":["pana","chamo","chévere","burda","vaina"],"Chile":["po","cachai","bacán","fome","al tiro","pololo","weón"],"España":["tío","vale","guay","currar","mola","chaval"],"Colombia":["parce","bacano","camellar","parcero"],"Perú":["causa","pata","jato"],"Uruguay":["bo","gurí","botija"],"Cuba":["asere","qué bolá"],"Costa Rica":["mae","pura vida","tuanis"]};
const FORMAL=["sin embargo","no obstante","por lo tanto","además","asimismo","en consecuencia","cabe destacar"];
const s=document.getElementById('pais');PAISES.forEach(p=>{let o=document.createElement('option');o.value=p;o.textContent=p;s.appendChild(o)});s.value="Argentina";
function analizar(){
 const texto=document.getElementById('texto').value;if(!texto.trim())return alert("Pegá un texto");
 const pais=document.getElementById('pais').value;const region=document.getElementById('region').value;const ciudad=document.getElementById('ciudad').value;
 const palabras=texto.trim().split(/\s+/).filter(Boolean);const oraciones=texto.split(/[.!?]+/).filter(s=>s.trim().length>4);
 const lens=oraciones.map(o=>o.split(/\s+/).length);const mean=lens.reduce((a,b)=>a+b,0)/lens.length;const std=Math.sqrt(lens.reduce((a,b)=>a+Math.pow(b-mean,2),0)/lens.length);
 const txtLow=texto.toLowerCase();let formal=FORMAL.filter(m=>txtLow.includes(m)).length;
 let dict=REGIONAL[pais]||[].concat(...Object.values(REGIONAL));let regional=dict.filter(t=>txtLow.includes(t));
 let primera=(texto.toLowerCase().match(/\b(yo|me|mi|siento|pienso|creo)\b/g)||[]).length;
 let diversidad=new Set(palabras.map(w=>w.toLowerCase().replace(/[.,;:!?]/g,''))).size/palabras.length*100;
 let aspectos=[
  {n:"Estructura",ia:Math.min(95, (std<3?35:0)+(std<6?20:0)+(lens.every(l=>l>8&&l<22)?30:0)+10)},
  {n:"Formalidad",ia:Math.min(95, formal*15 + (texto.includes("No solo")?15:0))},
  {n:"Naturalidad",ia:Math.min(90, 60-(std*5)+ (formal>1?10:0))},
  {n:"Vocabulario",ia:Math.min(95, (diversidad<55?35:0)+(diversidad>85?20:0)+15)},
  {n:"Corrección",ia:Math.min(90, (palabras.length>80?25:0)+15)},
  {n:"Voz personal",ia:Math.min(95, (primera==0?40:0)+(regional.length==0?20:0)+15)}
 ];
 aspectos=aspectos.map(a=>({nombre:a.n,ia:Math.max(5,Math.round(a.ia)),humano:100-Math.round(a.ia)}));
 const prom=Math.round(aspectos.reduce((s,a)=>s+a.ia,0)/6);
 let ver=prom<45?"Más compatible con señales humanas":prom<70?"Señales mixtas — revisión manual recomendada":"Más compatible con señales de IA";
 let ctxStr=[pais,region,ciudad].filter(Boolean).join(" · ");
 document.getElementById('output').innerHTML=`
 <div class="card" style="text-align:center"><div class="big-num">${prom}%</div><div>SEÑALES IA</div><div class="small" style="margin-top:8px;color:#f2d36b">${ver}</div><div class="small">Contexto: ${ctxStr}</div></div>
 <div class="card"><h2>Perfil por aspectos</h2>${aspectos.map(a=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><b>${a.nombre}</b><b>${a.ia}% IA / ${a.humano}% Hum</b></div><div class="bar"><i style="width:${a.ia}%"></i></div></div>`).join("")}<div class="small">Promedio: (${aspectos.map(a=>a.ia).join(" + ")})/6 = ${prom}%</div></div>
 <div class="card"><h2>Rasgos regionales</h2><div class="small">Detectado: ${regional.length?regional.join(" · "):"Sin coincidencias"}</div><div class="small">Las expresiones regionales son contexto, no prueba de humanidad.</div></div>
 <div class="card"><textarea style="min-height:180px" readonly>DETECTOR DE IA ORIÓN\nContexto: ${ctxStr}\nResultado: ${prom}% IA / ${100-prom}% humano\nVeredicto: ${ver}\n\n${aspectos.map(a=>`${a.nombre}: ${a.ia}% IA / ${a.humano}% Hum`).join("\n")}\n\nNota: heurístico, no prueba definitiva.</textarea></div>`;
}
function cargarEjemplo(){document.getElementById('texto').value="*Lance Rivalder* --Siento el tirón en mi túnica y me giro hacia Aeltharion. Sus dedos aprietan la tela con fuerza mientras intenta respirar entre bocanadas hiperventiladas.--";analizar();}
function limpiar(){document.getElementById('texto').value="";document.getElementById('output').innerHTML="";}
</script>
</body>
</html>
